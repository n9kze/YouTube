<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Upgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00f2ff; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; color: white; }
        #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; width: auto; height: auto; z-index: -2; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.45); z-index: -1; }
        .box { border: 2px solid var(--neon); padding: 30px 20px; border-radius: 20px; box-shadow: 0 0 25px rgba(0, 242, 255, 0.35); width: 85%; max-width: 360px; text-align: center; background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        h1 { margin: 0 0 15px 0; color: var(--neon); text-transform: uppercase; letter-spacing: 2px; font-size: 22px; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .stats { font-size: 26px; font-weight: bold; margin: 20px 0; letter-spacing: 1px; }
        .btn { background: transparent; border: 2px solid var(--neon); color: var(--neon); padding: 15px 30px; border-radius: 12px; font-size: 18px; cursor: pointer; transition: all 0.2s ease; width: 100%; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
        .btn:active { background: var(--neon); color: #000; transform: scale(0.96); box-shadow: 0 0 20px rgba(0, 242, 255, 0.8); }
    </style>
</head>
<body>
    <video autoplay loop muted playsinline id="bg-video">
        <source src="https://files.catbox.moe/k363g3.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="box">
        <h1>NFT UPGRADER</h1>
        <div class="stats" id="lvl">Уровень: 1</div>
        <button class="btn" onclick="upgrade()">ПРОКАЧАТЬ</button>
    </div>
    <script>
        let lvl = 1;
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        function upgrade() {
            if(Math.random() > 0.5) {
                lvl++;
                document.getElementById('lvl').innerText = "Уровень: " + lvl;
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
            } else {
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                }
                alert("Неудача! Попробуйте снова.");
            }
        }
    </script>
</body>
</html>
