<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Запрет кэширования -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Upgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00f2ff; }
        body { 
            margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; 
            font-family: sans-serif; color: white;
            background: linear-gradient(-45deg, #000428, #004e92, #00f2ff, #000428);
            background-size: 400% 400%; animation: gradient 10s ease infinite;
        }
        @keyframes gradient { 0% {background-position: 0% 50%} 50% {background-position: 100% 50%} 100% {background-position: 0% 50%} }
        .box { 
            border: 2px solid var(--neon); padding: 30px; border-radius: 20px; 
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            text-align: center; width: 80%;
        }
        h1 { color: var(--neon); text-transform: uppercase; }
        button { 
            background: transparent; border: 2px solid var(--neon); color: var(--neon); 
            padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer;
        }
        button:active { background: var(--neon); color: black; }
    </style>
</head>
<body>
    <div class="box">
        <h1>NFT UPGRADER</h1>
        <p id="lvl">Уровень: 1</p>
        <button onclick="upgrade()">ПРОКАЧАТЬ</button>
    </div>
    <script>
        let lvl = 1;
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        function upgrade() {
            lvl++;
            document.getElementById('lvl').innerText = "Уровень: " + lvl;
            if(tg) tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>
