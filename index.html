<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts Upgrader</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #111; color: white; font-family: sans-serif; }
        
        /* Стеклянный круг с градиентом */
        .glass-circle {
            width: 180px; height: 180px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            /* Динамическое заполнение через conic-gradient */
            background: conic-gradient(gold 0% var(--perc), transparent var(--perc) 100%);
            transform: rotate(180deg); /* Начинаем снизу */
        }

        /* Внутренний слой, чтобы не перекрывать текст */
        .inner-content {
            width: 160px; height: 160px; border-radius: 50%;
            background: #111;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform: rotate(-180deg); /* Возвращаем текст в нормальное положение */
        }

        .perc { font-size: 28px; font-weight: bold; }
        .label { font-size: 12px; color: #888; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="glass-circle" id="wheel" style="--perc: 30%;">
        <div class="inner-content">
            <span class="perc">30.0%</span>
            <span class="label">шанс</span>
        </div>
    </div>

    <button onclick="setPerc(Math.random() * 100)" style="margin-top:20px">Тест (рандом %)</button>

    <script>
        function setPerc(val) {
            document.getElementById('wheel').style.setProperty('--perc', val + '%');
            document.querySelector('.perc').innerText = val.toFixed(1) + '%';
        }
    </script>
</body>
</html>
