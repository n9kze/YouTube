<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts Upgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #FFD700; }
        body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: white; overflow: hidden; }
        
        #bg-img { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: -1; }
        
        h1 { margin-bottom: 20px; font-size: 18px; color: #ddd; text-transform: uppercase; letter-spacing: 1px; }

        /* Контейнер чуть меньше и поднят выше */
        .wheel-wrapper { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }

        .wheel {
            width: 150px; height: 150px; border-radius: 50%;
            border: 10px solid rgba(255, 255, 255, 0.1);
            background: conic-gradient(var(--gold) 0% 30%, transparent 30% 100%);
            display: flex; align-items: center; justify-content: center;
        }

        .center-text { text-align: center; font-weight: bold; }
        .perc { font-size: 24px; display: block; }
        .label { font-size: 12px; color: #aaa; text-transform: uppercase; }

        /* Стрелка теперь вращается отдельно вокруг центра */
        .pointer-container { position: absolute; width: 200px; height: 200px; transition: transform 3s cubic-bezier(0.15, 0.9, 0.15, 1); }
        .pointer {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent; 
            border-top: 25px solid white; /* Стрелка стала больше */
            filter: drop-shadow(0 0 5px white);
        }

        .btn {
            background: #b8860b; color: white; border: none;
            padding: 15px 70px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .btn:active { background: #d4af37; transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <img src="bg.jpg?v=4" id="bg-img" alt="">
    <div class="overlay"></div>

    <h1>TELEGRAM GIFTS UPGRADER</h1>

    <div class="wheel-wrapper">
        <div class="pointer-container" id="pointer">
            <div class="pointer"></div>
        </div>
        <div class="wheel">
            <div class="center-text">
                <span class="perc">30.0%</span>
                <span class="label">шанс</span>
            </div>
        </div>
    </div>

    <button class="btn" id="btn" onclick="spin()">ПРОКАЧАТЬ</button>

    <script>
        let rotation = 0;
        let isSpinning = false;
        const tg = window.Telegram?.WebApp;
        if(tg) { tg.ready(); tg.expand(); }

        function spin() {
            if(isSpinning) return;
            isSpinning = true;
            document.getElementById('btn').disabled = true;

            const isWin = Math.random() < 0.3;
            // Целимся в 30% сектор (0-108 градусов)
            const targetDeg = isWin ? (Math.random() * 90) : (Math.random() * 240 + 110);
            
            rotation += 1440 + targetDeg;
            document.getElementById('pointer').style.transform = `rotate(${rotation}deg)`;

            tg?.HapticFeedback?.impactOccurred('medium');

            setTimeout(() => {
                isSpinning = false;
                document.getElementById('btn').disabled = false;
                if(isWin) {
                    alert("🎉 Успех! Вы выиграли Букет тюльпанов!");
                    tg?.HapticFeedback?.notificationOccurred('success');
                } else {
                    alert("Попробуйте снова!");
                    tg?.HapticFeedback?.notificationOccurred('error');
                }
            }, 3200);
        }
    </script>
</body>
</html>
