<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts Upgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #FFD700; }
        body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: white; overflow: hidden; }
        
        #bg-img { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: -1; }
        
        h1 { margin-bottom: 50px; font-size: 18px; color: #fff; text-transform: uppercase; letter-spacing: 2px; }

        /* Контейнер для всего (круг + стрелка) */
        .game-wrapper { position: relative; width: 180px; height: 180px; margin-bottom: 60px; }

        /* Статичный красивый круг с текстом */
        .glass-circle {
            width: 100%; height: 100%; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .center-text { text-align: center; }
        .perc { font-size: 32px; font-weight: bold; display: block; }
        .label { font-size: 14px; color: #ccc; text-transform: uppercase; }

        /* Стрелка, которая будет крутиться вокруг круга */
        .pointer-container { 
            position: absolute; top: -30px; left: 0; width: 100%; height: 100%; 
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
        }
        .pointer {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; 
            border-left: 12px solid transparent; border-right: 12px solid transparent; 
            border-top: 25px solid white; filter: drop-shadow(0 0 5px white);
        }

        .btn {
            background: linear-gradient(180deg, #b8860b 0%, #8b6508 100%);
            color: white; border: none;
            padding: 16px 80px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <img src="bg.jpg?v=7" id="bg-img" alt="">
    <div class="overlay"></div>

    <h1>TELEGRAM GIFTS UPGRADER</h1>

    <div class="game-wrapper">
        <div class="glass-circle">
            <div class="center-text">
                <span class="perc">30.0%</span>
                <span class="label">шанс</span>
            </div>
        </div>
        <div class="pointer-container" id="pointer">
            <div class="pointer"></div>
        </div>
    </div>

    <button class="btn" id="btn" onclick="spin()">ПРОКАЧАТЬ</button>

    <script>
        let currentRotation = 0;
        let isSpinning = false;
        const tg = window.Telegram?.WebApp;
        
        function spin() {
            if(isSpinning) return;
            isSpinning = true;
            document.getElementById('btn').disabled = true;

            const randomAngle = Math.floor(Math.random() * 360);
            currentRotation += 1440 + randomAngle;
            
            // Крутим только стрелку
            document.getElementById('pointer').style.transform = `rotate(${currentRotation}deg)`;

            const finalAngle = currentRotation % 360;
            // 30% шанса (сектор 0-108 градусов)
            const isWin = (finalAngle >= 0 && finalAngle <= 108);

            setTimeout(() => {
                isSpinning = false;
                document.getElementById('btn').disabled = false;
                alert(isWin ? "🎉 Победа!" : "Попробуйте снова!");
            }, 4200);
        }
    </script>
</body>
</html>
