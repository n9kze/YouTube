<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts Upgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #FFD700; --bg-dark: #0f0f12; }
        body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: white; background: #0b0b12; }
        
        h1 { margin-bottom: 30px; font-size: 20px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        .wheel-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Само колесо (неподвижное) */
        .wheel {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 15px solid #1a1a20;
            background: conic-gradient(var(--gold) 0% 30%, transparent 30% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Центр с текстом */
        .center-text {
            text-align: center;
            font-weight: bold;
        }
        .perc { font-size: 32px; display: block; }
        .label { font-size: 14px; color: #888; text-transform: uppercase; }

        /* Вращающаяся стрелка */
        .pointer-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.15, 1);
        }
        .pointer {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid white;
        }

        .btn {
            margin-top: 50px;
            background: #b8860b; /* Золотой цвет */
            color: white;
            border: none;
            padding: 15px 80px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:active { background: #d4af37; }
        .btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <h1>TELEGRAM GIFTS UPGRADER</h1>

    <div class="wheel-wrapper">
        <div class="pointer-container" id="pointer">
            <div class="pointer"></div>
        </div>
        <div class="wheel">
            <div class="center-text">
                <span class="perc" id="perc">30.0%</span>
                <span class="label">шанс</span>
            </div>
        </div>
    </div>

    <button class="btn" id="btn" onclick="spin()">ПРОКАЧАТЬ</button>

    <script>
        let rotation = 0;
        let isSpinning = false;
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        function spin() {
            if(isSpinning) return;
            isSpinning = true;
            document.getElementById('btn').disabled = true;

            // Выигрыш 30% (попадаем в сектор от 0 до 108 градусов, так как 360 * 0.3 = 108)
            const isWin = Math.random() < 0.3;
            const targetDeg = isWin ? (Math.random() * 100) : (Math.random() * 240 + 110);
            
            rotation += 1440 + targetDeg; // 4 оборота + сектор
            document.getElementById('pointer').style.transform = `rotate(${rotation}deg)`;

            tg?.HapticFeedback?.impactOccurred('medium');

            setTimeout(() => {
                isSpinning = false;
                document.getElementById('btn').disabled = false;
                if(isWin) {
                    alert("🎉 Успех! Вы выиграли Букет тюльпанов!");
                    tg?.HapticFeedback?.notificationOccurred('success');
                } else {
                    alert("Попробуйте снова!");
                    tg?.HapticFeedback?.notificationOccurred('error');
                }
            }, 3200);
        }
    </script>
</body>
</html>
