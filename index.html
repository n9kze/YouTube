<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Upgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --neon: #00f2ff; }
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; padding: 0; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; color: white;
            background: linear-gradient(-45deg, #000428, #004e92, #00f2ff, #000428);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .box { 
            border: 2px solid var(--neon); padding: 30px 20px; border-radius: 20px; 
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.35); width: 85%; max-width: 360px; 
            text-align: center; background: rgba(10, 10, 15, 0.75); 
            backdrop-filter: blur(10px);
        }

        h1 { margin: 0 0 15px 0; color: var(--neon); text-transform: uppercase; letter-spacing: 2px; font-size: 22px; }
        .stats { font-size: 26px; font-weight: bold; margin: 20px 0; }
        .btn { 
            background: transparent; border: 2px solid var(--neon); color: var(--neon); 
            padding: 15px 30px; border-radius: 12px; font-size: 18px; cursor: pointer; 
            transition: all 0.2s; width: 100%; font-weight: bold; text-transform: uppercase; 
        }
        .btn:active { background: var(--neon); color: #000; transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="box">
        <h1>NFT UPGRADER</h1>
        <div class="stats" id="lvl">Уровень: 1</div>
        <button class="btn" onclick="upgrade()">ПРОКАЧАТЬ</button>
    </div>
    <script>
        let lvl = 1;
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        function upgrade() {
            if (Math.random() > 0.5) {
                lvl++;
                document.getElementById('lvl').innerText = "Уровень: " + lvl;
                tg?.HapticFeedback?.notificationOccurred('success');
            } else {
                tg?.HapticFeedback?.notificationOccurred('error');
                alert("Неудача! Попробуйте снова.");
            }
        }
    </script>
</body>
</html>
